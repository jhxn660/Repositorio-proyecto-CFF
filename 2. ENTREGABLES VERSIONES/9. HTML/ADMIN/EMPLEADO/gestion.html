<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Menú - Corralejo Fast Food</title>
    <link rel="stylesheet" href="css/gestion.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <img class="conterimg" src="img/imagen fuego.png" alt="Logo Corralejo">
            <h2>Corralejo <span class="letracolor">Fast Food</span></h2>
        </div>

        <nav>
            <ul class="nav-logos">
                <li class="logo1"><i class="fa-solid fa-bell"></i></li>
                <li class="logo2"><i class="fa-regular fa-circle-user"></i></li>
            </ul>
        </nav>
    </header>

    <main class="container">

        <aside class="sidebar">
            <h3>Administrador</h3>
            <ul>
                <li>
                    <a href="/ADMIN/INFORMACION/informacion.html" class="sidebar-link">
                        <i class="fa-solid fa-circle-info"></i> Gestión de Información
                    </a>
                </li>
                <li>
                    <a href="/ADMIN/INVENTARIO/Insumos.html" class="sidebar-link">
                        <i class="fa-solid fa-paste"></i> Gestión de Inventario
                    </a>
                </li>
                <li>
                    <a href="/ADMIN/MENU/index.html" class="sidebar-link">
                        <i class="fa-solid fa-utensils"></i> Gestión de Menú
                    </a>
                </li>
                <li>
                    <a href="/ADMIN/ESTADISTICA/estadistica.html" class="sidebar-link">
                        <i class="fa-solid fa-arrow-trend-up"></i> Estadísticas de Negocio
                    </a>
                </li>
                <li class="active">
                    <a href="/ADMIN/EMPLEADO/gestion.html" class="sidebar-link">
                        <i class="fa-solid fa-people-line"></i> Gestión de Empleados
                    </a>
                </li>
            </ul>
        </aside>

        <section class="content">
            <div class="page-header">
                <h2 class="page-heading">Gestión de Empleados</h2>
                <div class="header-actions">
                    <button class="btn-solid-dark" id="btnOpenAddModal">
                        <i class="fa-solid fa-plus"></i> Añadir Empleado
                    </button>
                </div>
            </div>
        
            <div class="section-block">
                <h3 class="group-heading">
                    <span class="status-indicator indicator-green"></span> Empleados Activos
                </h3>
                <div class="employee-grid" id="activeEmployeeGrid"></div>
            </div>
        
            <div class="section-block">
                <h3 class="group-heading">
                    <span class="status-indicator indicator-red"></span> En Descanso / Inactivos
                </h3>
                <div class="employee-grid" id="inactiveEmployeeGrid"></div>
            </div>
        
            <div class="modal-overlay" id="employeeModal">
                <div class="modal-content">
                    <h3 class="modal-title" id="modalTitle">Añadir Empleado</h3>
                    
                    <form id="employeeForm">
                        <input type="hidden" id="empId">
                        
                        <div class="form-group">
                            <label for="empName">Nombre Completo</label>
                            <input type="text" id="empName" class="form-input" placeholder="Ej. Carlos Ramirez" required>
                        </div>
        
                        <div class="form-group">
                            <label for="empSchedule">Horario</label>
                            <input type="text" id="empSchedule" class="form-input" placeholder="Ej. 08:00 AM - 04:00 PM" required>
                        </div>
        
                        <div class="form-row">
                            <div class="form-group half">
                                <label for="empRole">Rol</label>
                                <select id="empRole" class="form-input" required>
                                    <option value="" disabled selected>Seleccione un rol</option>
                                    <option value="Jefe">Jefe</option>
                                    <option value="Cajero">Cajero</option>
                                    <option value="Cocinero">Cocinero</option>
                                    <option value="Mesero">Mesero</option>
                                </select>
                            </div>
                            <div class="form-group half">
                                <label for="empStatus">Estado</label>
                                <select id="empStatus" class="form-input" required>
                                    <option value="Trabajando">Trabajando</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>
                        </div>
        
                        <div class="modal-footer">
                            <button type="button" class="btn-outline-pill" id="btnCancelModal">Cancelar</button>
                            <button type="submit" class="btn-solid-dark-pill" id="btnSaveEmployee">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>


    <script src="js/script.js"></script>
</body>
</html>
