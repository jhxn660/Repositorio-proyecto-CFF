<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empleados - Corralejo Fast Food</title>
    <link rel="stylesheet" href="/2. ENTREGABLES VERSIONES/9. HTML/M Gestionar Empleado (A)/M GestionarEmpleado.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <img class="conterimg" src="/empleados/img/imagen fuego.png" alt="Logo Fuego">
            <h2>Corralejo <span class="letracolor">Fast Food</span></h2>
        </div>
        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
            <i class="fa-solid fa-bars"></i>
        </button>
        <nav>
            <ul class="nav-logos">
                <li class="logo1"><i class="fa-solid fa-bell"></i></li>
                <li class="logo2"><i class="fa-regular fa-circle-user"></i></li>
            </ul>
        </nav>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <ul>
            <li><i class="fa-solid fa-chart-line"></i> Dashboard</li>
            <li><i class="fa-solid fa-pen-to-square"></i> Gestión de Pedidos</li>
            <li><i class="fa-solid fa-utensils"></i> Menú</li>
            <li class="active"><i class="fa-solid fa-users-gear"></i> Gestión de Empleados</li>
            <li><i class="fa-solid fa-book-open"></i> Gestión de Ventas</li>
        </ul>
    </div>
    
    <div class="main-layout">
        
        <aside class="sidebar">
            <h3>Panel Administrador</h3>
            <ul>
                <li><i class="fa-solid fa-chart-line"></i> Dashboard</li>
                <li><i class="fa-solid fa-pen-to-square"></i> Gestión de Pedidos</li>
                <li><i class="fa-solid fa-utensils"></i> Menú</li>
                <li class="active"><i class="fa-solid fa-users-gear"></i> Gestión de Empleados</li>
                <li><i class="fa-solid fa-book-open"></i> Gestión de Ventas</li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2 class="page-heading">Gestión de Empleados</h2>
                <div class="header-actions">
                    <button class="btn-solid-dark" id="btnOpenAddModal">
                        <i class="fa-solid fa-plus"></i> Añadir Empleado
                    </button>
                </div>
            </div>

            <div class="employee-grid" id="employeeGrid">
                </div>
        </main>
    </div>

    <div class="modal-overlay" id="employeeModal">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">Añadir Empleado</h3>
            
            <form id="employeeForm">
                <input type="hidden" id="empId">
                
                <div class="form-group">
                    <label for="empName">Nombre Completo</label>
                    <input type="text" id="empName" class="form-input" placeholder="Ej. Carlos Ramirez" required>
                </div>

                <div class="form-group">
                    <label for="empSchedule">Horario</label>
                    <input type="text" id="empSchedule" class="form-input" placeholder="Ej. 08:00 AM - 04:00 PM" required>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="empRole">Rol</label>
                        <select id="empRole" class="form-input" required>
                            <option value="" disabled selected>Seleccione un rol</option>
                            <option value="Jefe">Jefe</option>
                            <option value="Cajero">Cajero</option>
                            <option value="Cocinero">Cocinero</option>
                            <option value="Mesero">Mesero</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label for="empStatus">Estado</label>
                        <select id="empStatus" class="form-input" required>
                            <option value="Trabajando">Trabajando</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-outline-pill" id="btnCancelModal">Cancelar</button>
                    <button type="submit" class="btn-solid-dark-pill" id="btnSaveEmployee">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 1. Control del Menú Móvil
        const menuToggle = document.getElementById('menuToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        // Al dar clic en el botón hamburguesa, se añade o quita la clase "open"
        menuToggle.addEventListener('click', () => mobileMenu.classList.toggle('open'));

        // 2. Base de Datos Simulada (Arreglo de Objetos)
        // En un futuro, esto será reemplazado por peticiones a una base de datos real (MySQL, etc.)
        let employees = [
            { id: 1, name: "Carlos Ramirez", role: "Cocinero", schedule: "08:00 AM - 04:00 PM", status: "Trabajando" },
            { id: 2, name: "Ana Torres", role: "Cajero", schedule: "02:00 PM - 10:00 PM", status: "Trabajando" },
            { id: 3, name: "Luis Mendoza", role: "Mesero", schedule: "Descanso", status: "Inactivo" },
            { id: 4, name: "Diana Rojas", role: "Jefe", schedule: "09:00 AM - 06:00 PM", status: "Trabajando" }
        ];

        // Variables globales de control
        let nextId = 5; // Simula un AUTO_INCREMENT para los nuevos IDs
        let isEditing = false; // Bandera para saber si estamos añadiendo o editando

        // Referencias a los elementos del HTML
        const employeeGrid = document.getElementById('employeeGrid');
        const modal = document.getElementById('employeeModal');
        const employeeForm = document.getElementById('employeeForm');

        // 3. Función para Renderizar (Dibujar) las Tarjetas
        // Esta función lee el arreglo "employees" y dibuja las tarjetas en el HTML
        function renderGrid() {
            // Limpia el contenedor antes de dibujar para no duplicar datos
            employeeGrid.innerHTML = '';
            
            // Recorre cada empleado en el arreglo
            employees.forEach(emp => {
                // Validación para asignar la clase del borde según si trabaja o no
                const borderClass = emp.status === 'Trabajando' ? 'border-green' : 'border-red';
                
                // Crea un nuevo div de tipo tarjeta
                const card = document.createElement('div');
                card.className = `employee-card ${borderClass}`; // Aplica clase base y clase de color
                
                // Estructura interna de la tarjeta (Sin imagen, solo datos y botones)
                card.innerHTML = `
                    <h4 class="emp-name">${emp.name}</h4>
                    <p class="emp-role">${emp.role}</p>
                    <div class="emp-schedule">
                        <i class="fa-regular fa-clock"></i> ${emp.schedule}
                    </div>
                    <div class="card-actions">
                        <button class="btn-icon edit" onclick="openEditModal(${emp.id})" title="Editar">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn-icon delete" onclick="deleteEmployee(${emp.id})" title="Eliminar">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                // Inserta la tarjeta en el contenedor Grid
                employeeGrid.appendChild(card);
            });
        }

        // 4. Funciones para Abrir y Cerrar la Ventana Modal
        const openModal = () => modal.classList.add('active'); // Muestra el Modal
        const closeModal = () => {
            modal.classList.remove('active'); // Oculta el Modal
            employeeForm.reset(); // Limpia los campos del formulario
            isEditing = false; // Reinicia la bandera de edición
        };

        // Evento: Al hacer clic en "Añadir Empleado"
        document.getElementById('btnOpenAddModal').addEventListener('click', () => {
            document.getElementById('modalTitle').textContent = 'Añadir Empleado';
            document.getElementById('empId').value = ''; // Se limpia el ID oculto
            document.getElementById('empStatus').value = 'Trabajando'; // Valor por defecto
            isEditing = false; // Confirmamos que es modo Añadir
            openModal();
        });

        // Eventos para cerrar el Modal (con botón Cancelar o clic fuera de la ventana)
        document.getElementById('btnCancelModal').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        // 5. Función principal de Guardado (Se ejecuta al enviar el formulario)
        employeeForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Evita que la página se recargue al enviar el formulario
            
            // Recolectamos los datos escritos por el usuario
            const empData = {
                name: document.getElementById('empName').value.trim(),
                schedule: document.getElementById('empSchedule').value.trim(),
                role: document.getElementById('empRole').value,
                status: document.getElementById('empStatus').value
            };

            // Lógica de decisión: ¿Editamos o Añadimos?
            if (isEditing) {
                // Modo Edición: Buscamos al empleado por su ID y actualizamos sus datos
                const idToEdit = parseInt(document.getElementById('empId').value);
                const index = employees.findIndex(emp => emp.id === idToEdit);
                if (index !== -1) employees[index] = { id: idToEdit, ...empData };
            } else {
                // Modo Añadir: Insertamos un nuevo objeto al arreglo con un ID nuevo
                employees.push({ id: nextId++, ...empData });
            }

            // Redibujamos las tarjetas para reflejar los cambios y cerramos el modal
            renderGrid();
            closeModal();
        });

        // 6. Función para Editar (Se ejecuta al tocar el botón del Lápiz)
        window.openEditModal = function(id) {
            // Busca la información del empleado seleccionado
            const emp = employees.find(e => e.id === id);
            if (!emp) return;

            // Rellena el formulario con los datos actuales del empleado
            document.getElementById('modalTitle').textContent = 'Editar Empleado';
            document.getElementById('empId').value = emp.id; // Guarda el ID en el input oculto
            document.getElementById('empName').value = emp.name;
            document.getElementById('empSchedule').value = emp.schedule;
            document.getElementById('empRole').value = emp.role;
            document.getElementById('empStatus').value = emp.status;

            isEditing = true; // Activa la bandera de modo edición
            openModal();
        };

        // 7. Función para Eliminar (Se ejecuta al tocar el botón de Basurero)
        window.deleteEmployee = function(id) {
            // Muestra alerta de confirmación nativa del navegador
            if(confirm(`¿Deseas eliminar a este empleado?`)) {
                // Filtra el arreglo quitando al empleado que coincide con el ID
                employees = employees.filter(emp => emp.id !== id);
                // Redibuja las tarjetas sin el empleado eliminado
                renderGrid();
            }
        };

        // Ejecución inicial: Dibuja las tarjetas base al cargar la página
        renderGrid();
    </script>
</body>
</html>
