<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CFF</title>

    <!-- ===================== BOOTSTRAP 5 (CSS) ===================== -->
    <!-- Se carga Bootstrap desde CDN para usar su sistema de grid (container, row, col) -->
    <!-- y sus utilidades (d-flex, justify-content-center, align-items-center, etc.) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fuente Albert Sans (la misma que usaba el diseño original) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">

    <!-- Nuestro CSS personalizado, va DESPUÉS de Bootstrap para poder sobreescribirlo -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===================== CONTENEDOR PRINCIPAL (BOOTSTRAP) ===================== -->
    <!-- container-fluid: ocupa todo el ancho disponible -->
    <!-- d-flex + justify-content-center + align-items-center: centra el contenido horizontal y verticalmente -->
    <!-- min-vh-100: hace que el contenedor mida al menos el 100% del alto de la pantalla (viewport height) -->
    <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 login-wrapper">

        <!-- ===================== TARJETA DE LOGIN (GRID DE BOOTSTRAP) ===================== -->
        <!-- row + justify-content-center: centra la columna dentro de la fila -->
        <div class="row justify-content-center w-100">

            <!-- Columnas responsivas de Bootstrap:
                 col-11  -> en móviles muy pequeños ocupa casi todo el ancho
                 col-sm-8 -> en pantallas pequeñas ocupa el 66%
                 col-md-6 -> en pantallas medianas ocupa el 50%
                 col-lg-4 -> en pantallas grandes ocupa el 33% (ancho similar a max-width: 430px) -->
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">

                <!-- Tarjeta usando el componente "card" de Bootstrap -->
                <!-- shadow-lg: sombra grande de Bootstrap -->
                <!-- rounded-4: bordes redondeados de Bootstrap -->
                <!-- position-relative: necesario para posicionar el logo circular y los adornos naranjas -->
                <div class="card form-box shadow-lg rounded-4 position-relative p-4 p-md-5">

                    <!-- ===================== LOGO CIRCULAR ===================== -->
                    <!-- d-flex + justify-content-center + align-items-center: centra la imagen dentro del círculo -->
                    <div class="logo-circle position-absolute d-flex justify-content-center align-items-center rounded-circle shadow-sm">
                        <img src="img/imagen fuego.png" alt="Logo CFF" width="35" class="img-fluid">
                    </div>

                    <!-- ===================== CABECERA ===================== -->
                    <!-- text-center: clase de Bootstrap para centrar el texto -->
                    <!-- mb-4: margin-bottom de Bootstrap (espaciado) -->
                     
                    <div class="header-form text-center mb-4">
                        <h1 class="fw-bold mb-0">Bienvenido a CFF</h1>
                        <p class="brand-subtitle fw-semibold mb-0">
                            Corralejo <span class="highlight">Fast Food</span>
                        </p>
                    </div>

                    <!-- ===================== FORMULARIO ===================== -->
                    <form id="loginForm" novalidate>

                        <!-- Grupo de Correo Electrónico -->
                        <!-- mb-3: margin-bottom de Bootstrap, separación entre campos -->
                        <div class="mb-3 text-start">
                            <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                            <!-- form-control: clase de Bootstrap que da estilo a los inputs -->
                            <input
                                type="email"
                                id="email"
                                class="form-control custom-input"
                                placeholder="Ejemplo: pepito@correo.com"
                                required
                            >
                        </div>

                        <!-- Grupo de Contraseña -->
                        <div class="mb-3 text-start">
                            <label for="password" class="form-label fw-bold">Contraseña</label>
                            <input
                                type="password"
                                id="password"
                                class="form-control custom-input"
                                placeholder="Ejemplo: ********"
                                required
                            >
                        </div>

                        <!-- Botón de envío -->
                        <!-- btn + w-100: clases de Bootstrap para botón de ancho completo -->
                        <!-- btn-submit: clase personalizada para el color de marca -->
                        <button type="submit" class="btn btn-submit w-100 fw-semibold mt-2 mb-4">
                            Iniciar Sesión
                        </button>
                    </form>

                    <!-- ===================== PIE DE TARJETA (ENLACES) ===================== -->
                    <!-- d-flex + justify-content-between: distribuye los enlaces a los extremos -->
                    <div class="footer-links d-flex justify-content-between">
                        <a href="/LOGIN/REGISTRO/registeboo.html" class="link-left">Registrarse</a>
                        <a href="/LOGIN/RESTABLER/index.html" class="link-right">Olvidó contraseña</a>
                    </div>

                </div> <!-- fin .card.form-box -->

            </div> <!-- fin columna -->
        </div> <!-- fin row -->
    </div> <!-- fin container-fluid -->

    <!-- ===================== BOOTSTRAP (JS BUNDLE) ===================== -->
    <!-- Incluye Popper.js, necesario para componentes interactivos de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro script personalizado con la lógica de login -->
    <script src="js/script.js"></script>

</body>
</html>
