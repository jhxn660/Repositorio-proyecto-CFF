<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CFF</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-wrapper">
        
        <div class="form-box">
            
            <div class="header-form">
                <div class="logo-circle">
                    <img src="img/imagen fuego.png" alt="" width="50px">
                </div>
                <h1>Bienvenido a CFF</h1>
                <p class="brand-subtitle">Corralejo <span class="highlight">Fast Food</span></p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="Ejemplo: pepito@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ejemplo: ********" required>
                </div>

                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>

            <div class="footer-links">
                <a href="/LOGIN/REGISTRO/index.html" class="link-left">Registrarse</a>
                <a href="/LOGIN/RESTABLER/index.html" class="link-right">Olvidó contraseña</a>
            </div>

        </div>
    </div>

    <script src="js/script.js"></script>

</body>
</html>
