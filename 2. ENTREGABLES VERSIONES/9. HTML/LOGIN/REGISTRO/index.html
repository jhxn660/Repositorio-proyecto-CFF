<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Corralejo Fast Food</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="main-wrapper">
        
        <div class="form-box">
            
            <div class="header-form">
                <div class="logo-circle">
                    <svg viewBox="0 0 24 24">
                        <img src="img/imagen fuego.png" alt="imagen" class="img-logo">    
                    </svg>
                </div>
                <h1>Bienvenido/a</h1>
                <p class="brand-subtitle">Corralejo <span class="highlight">Fast Food</span></p>
            </div>

            <form id="registerForm">
                <div class="input-group">
                    <label for="username">Nombre de Usuario</label>
                    <input type="text" id="username" placeholder="Ingrese su nombre de usuario" required>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="Ingrese su correo electrónico" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" placeholder="Confirme nuevamente su contraseña" required>
                </div>

                <button type="submit" class="btn-submit">Registrar</button>
            </form>

            <div class="footer-link">
                <span>¿Ya tienes una cuenta?</span> <a href="/LOGIN/INICIO/index.html">Inicia Sesión</a>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
